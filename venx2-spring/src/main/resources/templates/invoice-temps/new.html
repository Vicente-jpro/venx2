<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body>
<content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🧾 Create Invoice</h2>
        <a th:href="@{/cart-temps}" class="btn btn-outline-secondary">← Back to Cart</a>
    </div>

    <div class="row">
        <div class="col-md-7">
            <div class="card mb-3">
                <div class="card-header"><h5>Cart Summary</h5></div>
                <div class="card-body p-0">
                    <table class="table mb-0">
                        <thead class="table-light">
                            <tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="ct : ${cartItems}">
                                <td th:text="${ct.item.description}"></td>
                                <td th:text="${ct.quantity}"></td>
                                <td th:text="${#numbers.formatDecimal(ct.item.price, 1, 2)}"></td>
                                <td th:text="${#numbers.formatDecimal(ct.item.price.multiply(new java.math.BigDecimal(ct.quantity)), 1, 2)}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" class="text-end fw-bold">Total:</td>
                                <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(total, 1, 2)} + ' AOA'"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card">
                <div class="card-header"><h5>Invoice Details</h5></div>
                <div class="card-body">
                    <form th:action="@{/invoice-temps}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Customer Name *</label>
                            <input type="text" name="clienteName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Payment Method *</label>
                            <select name="paymentMethod" class="form-select" required>
                                <option value="MONETARIO">💵 Cash (Monetário)</option>
                                <option value="TRANSFERENCIA">🏦 Transfer (Transferência)</option>
                                <option value="CARTAO_DEBITO">💳 Debit Card (Cartão Débito)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Total Cost</label>
                            <div class="input-group">
                                <span class="input-group-text">AOA</span>
                                <input type="text" class="form-control bg-light" th:value="${#numbers.formatDecimal(total, 1, 2)}" readonly>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Amount Received *</label>
                            <div class="input-group">
                                <span class="input-group-text">AOA</span>
                                <input type="number" name="valueDelivered" class="form-control" step="0.01"
                                       th:min="${total}" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2">✓ Confirm Invoice</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</content>
</body>
</html>
