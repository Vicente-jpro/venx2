<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body><content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🏭 Suppliers</h2>
        <a th:if="${profile != null and profile.admin}" th:href="@{/suppliers/new}" class="btn btn-success">+ New</a>
    </div>
    <div class="card"><div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
            <tbody>
                <tr th:each="s : ${suppliers}">
                    <td th:text="${s.nameSupplier}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.telephone}"></td>
                    <td>
                        <th:block th:if="${profile != null and profile.admin}">
                            <a th:href="@{/suppliers/{id}/edit(id=${s.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <form th:action="@{/suppliers/{id}/delete(id=${s.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </th:block>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(suppliers)}"><td colspan="4" class="text-center py-3">No suppliers.</td></tr>
            </tbody>
        </table>
    </div></div>
</content></body></html>
