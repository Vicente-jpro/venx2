<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body>
<content th:fragment="content">
    <div class="d-flex justify-content-between mb-4">
        <h2>✏️ Edit Profile</h2>
        <a th:href="@{/profiles}" class="btn btn-outline-secondary">← Back</a>
    </div>
    <div class="card"><div class="card-body">
        <form th:action="@{/profiles/{id}/update(id=${targetProfile.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Name *</label>
                    <input type="text" name="nameProfile" class="form-control" th:value="${targetProfile.nameProfile}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">WhatsApp</label>
                    <input type="text" name="whatsapp" class="form-control" th:value="${targetProfile.whatsapp}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Telephone</label>
                    <input type="text" name="telephone" class="form-control" th:value="${targetProfile.telephone}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Identity Card</label>
                    <input type="text" name="identityCard" class="form-control" th:value="${targetProfile.identityCard}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="MASCULINO" th:selected="${targetProfile.gender == 'MASCULINO'}">Masculino</option>
                        <option value="FEMININO" th:selected="${targetProfile.gender == 'FEMININO'}">Feminino</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Company</label>
                    <select name="companyId" class="form-select">
                        <option value="">-- Select --</option>
                        <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"
                                th:selected="${targetProfile.company != null and targetProfile.company.id == c.id}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">Update Profile</button>
                    <a th:href="@{/profiles}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </div>
            </div>
        </form>
    </div></div>
</content>
</body>
</html>
