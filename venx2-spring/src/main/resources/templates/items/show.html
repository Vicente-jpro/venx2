<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body>
<content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📦 Item Details</h2>
        <div>
            <th:block th:if="${profile != null and profile.admin}">
                <a th:href="@{/items/{id}/edit(id=${item.id})}" class="btn btn-primary">Edit</a>
            </th:block>
            <a th:href="@{/items}" class="btn btn-outline-secondary ms-2">← Back</a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <strong>Description:</strong>
                    <p th:text="${item.description}"></p>
                </div>
                <div class="col-md-3">
                    <strong>Item Code:</strong>
                    <p><code th:text="${item.itemCode}"></code></p>
                </div>
                <div class="col-md-3">
                    <strong>Stock:</strong>
                    <p><span th:class="${item.quantity > 0 ? 'badge bg-success fs-6' : 'badge bg-danger fs-6'}"
                             th:text="${item.quantity}"></span></p>
                </div>
                <div class="col-md-3">
                    <strong>Price (AOA):</strong>
                    <p class="text-success fw-bold fs-5" th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></p>
                </div>
                <div class="col-md-3">
                    <strong>Profit Value:</strong>
                    <p th:text="${item.profiteValue}"></p>
                </div>
                <div class="col-md-3">
                    <strong>Manufacturing Date:</strong>
                    <p th:text="${item.manufacturingDate}"></p>
                </div>
                <div class="col-md-3">
                    <strong>Expiration Date:</strong>
                    <p th:text="${item.expirationDate}"></p>
                </div>
                <div class="col-md-4">
                    <strong>Category:</strong>
                    <p th:text="${item.category != null ? item.category.nameCategory : '-'}"></p>
                </div>
                <div class="col-md-4">
                    <strong>Sector:</strong>
                    <p th:text="${item.sector != null ? item.sector.nameSector : '-'}"></p>
                </div>
                <div class="col-md-4">
                    <strong>Supplier:</strong>
                    <p th:text="${item.supplier != null ? item.supplier.nameSupplier : '-'}"></p>
                </div>
            </div>
            <div class="mt-3" th:if="${item.quantity != null and item.quantity > 0}">
                <form th:action="@{/cart-temps/add/{id}(id=${item.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-warning">🛒 Add to Cart</button>
                </form>
            </div>
        </div>
    </div>
</content>
</body>
</html>
