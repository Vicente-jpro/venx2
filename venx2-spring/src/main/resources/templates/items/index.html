<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body>
<content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📦 Items</h2>
        <a th:if="${profile != null and profile.admin}" th:href="@{/items/new}" class="btn btn-success">+ New Item</a>
    </div>

    <!-- Search -->
    <form th:action="@{/items}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="search" class="form-control" placeholder="Search by description or code..."
                   th:value="${search}">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
            <a th:href="@{/items}" class="btn btn-outline-danger" th:if="${search != null}">Clear</a>
        </div>
    </form>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Code</th>
                        <th>Description</th>
                        <th>Price (AOA)</th>
                        <th>Stock</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items.content}">
                        <td><code th:text="${item.itemCode}"></code></td>
                        <td th:text="${item.description}"></td>
                        <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                        <td>
                            <span th:class="${item.quantity > 0 ? 'badge bg-success' : 'badge bg-danger'}"
                                  th:text="${item.quantity}"></span>
                        </td>
                        <td th:text="${item.category != null ? item.category.nameCategory : '-'}"></td>
                        <td>
                            <a th:href="@{/items/{id}(id=${item.id})}" class="btn btn-sm btn-outline-info">View</a>
                            <form th:action="@{/cart-temps/add/{id}(id=${item.id})}" method="post" class="d-inline"
                                  th:if="${item.quantity != null and item.quantity > 0}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-warning">🛒 Add</button>
                            </form>
                            <span th:if="${item.quantity == null or item.quantity <= 0}" class="badge bg-secondary">Out of stock</span>
                            <th:block th:if="${profile != null and profile.admin}">
                                <a th:href="@{/items/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                                <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this item?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </th:block>
                        </td>
                    </tr>
                    <tr th:if="${items.content.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-4">No items found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${items.totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${items.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/items(page=${items.number - 1}, search=${search})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, items.totalPages - 1)}"
                th:classappend="${i == items.number ? 'active' : ''}">
                <a class="page-link" th:href="@{/items(page=${i}, search=${search})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${items.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/items(page=${items.number + 1}, search=${search})}">Next</a>
            </li>
        </ul>
    </nav>
</content>
</body>
</html>
