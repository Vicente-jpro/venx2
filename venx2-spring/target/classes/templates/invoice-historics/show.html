<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body>
<content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🧾 Invoice Details</h2>
        <a th:href="@{/invoice-historics}" class="btn btn-outline-secondary">← Back</a>
    </div>

    <div class="card">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">Invoice #<span th:text="${invoice.id}"></span></h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6"><strong>Customer:</strong> <span th:text="${invoice.clienteName}"></span></div>
                <div class="col-md-6"><strong>Payment:</strong> <span class="badge bg-info" th:text="${invoice.paymentMethod}"></span></div>
                <div class="col-md-4"><strong>Total:</strong> <span class="text-success fw-bold" th:text="${#numbers.formatDecimal(invoice.total, 1, 2)} + ' AOA'"></span></div>
                <div class="col-md-4"><strong>Amount Received:</strong> <span th:text="${#numbers.formatDecimal(invoice.valueDeliveredCustomer, 1, 2)} + ' AOA'"></span></div>
                <div class="col-md-4"><strong>Change:</strong> <span th:text="${#numbers.formatDecimal(invoice.customerChange, 1, 2)} + ' AOA'"></span></div>
                <div class="col-md-6"><strong>Cart Code:</strong> <code th:text="${invoice.cartHistoric != null ? invoice.cartHistoric.codeCart : '-'}"></code></div>
                <div class="col-md-6"><strong>Date:</strong> <span th:text="${#temporals.format(invoice.createdAt, 'dd/MM/yyyy HH:mm')}"></span></div>
            </div>
        </div>
    </div>
</content>
</body>
</html>
