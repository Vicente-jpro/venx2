<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body>
<content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🧾 Invoice History</h2>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inv, iter : ${invoices}">
                        <td th:text="${iter.count}"></td>
                        <td th:text="${inv.clienteName}"></td>
                        <td class="text-success fw-bold" th:text="${#numbers.formatDecimal(inv.total, 1, 2)} + ' AOA'"></td>
                        <td>
                            <span class="badge bg-info" th:text="${inv.paymentMethod}"></span>
                        </td>
                        <td th:text="${#temporals.format(inv.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/invoice-historics/{id}(id=${inv.id})}" class="btn btn-sm btn-outline-info">View</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(invoices)}">
                        <td colspan="6" class="text-center text-muted py-4">No invoices yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</content>
</body>
</html>
