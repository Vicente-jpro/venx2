<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body><content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>💾 Saved Carts</h2>
        <a th:href="@{/cart-temps}" class="btn btn-outline-secondary">← Back to Cart</a>
    </div>
    <div th:if="${#lists.isEmpty(savedCodes)}" class="alert alert-info">No saved carts.</div>
    <div th:if="${!#lists.isEmpty(savedCodes)}" class="card"><div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark"><tr><th>Cart Code</th><th>Actions</th></tr></thead>
            <tbody>
                <tr th:each="code : ${savedCodes}">
                    <td><code th:text="${code}"></code></td>
                    <td>
                        <form th:action="@{/cart-saveds/restore/{code}(code=${code})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-success">Restore to Cart</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div></div>
</content></body></html>
