<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body><content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📋 Plans</h2>
        <a th:if="${profile != null and profile.admin}" th:href="@{/plans/new}" class="btn btn-success">+ New</a>
    </div>
    <div class="card"><div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark"><tr><th>Company</th><th>Sign Date</th><th>Expiration</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
                <tr th:each="p : ${plans}">
                    <td th:text="${p.company != null ? p.company.name : '-'}"></td>
                    <td th:text="${p.signDate}"></td>
                    <td th:text="${p.expirationDate}"></td>
                    <td><span th:class="${p.expired ? 'badge bg-danger' : 'badge bg-success'}"
                              th:text="${p.expired ? 'Expired' : 'Active'}"></span></td>
                    <td>
                        <th:block th:if="${profile != null and profile.admin}">
                            <form th:action="@{/plans/{id}/delete(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </th:block>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(plans)}"><td colspan="5" class="text-center py-3">No plans.</td></tr>
            </tbody>
        </table>
    </div></div>
</content></body></html>
