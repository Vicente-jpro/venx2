<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body><content th:fragment="content">
    <div class="d-flex justify-content-between mb-4">
        <h2>➕ New Plan</h2>
        <a th:href="@{/plans}" class="btn btn-outline-secondary">← Back</a>
    </div>
    <div class="card"><div class="card-body">
        <form th:action="@{/plans}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label fw-bold">Company *</label>
                    <select name="companyId" class="form-select" required>
                        <option value="">-- Select --</option>
                        <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select></div>
                <div class="col-md-4"><label class="form-label fw-bold">Sign Date *</label>
                    <input type="date" name="signDate" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label fw-bold">Expiration Date *</label>
                    <input type="date" name="expirationDate" class="form-control" required></div>
                <div class="col-12"><button type="submit" class="btn btn-success">Create Plan</button>
                    <a th:href="@{/plans}" class="btn btn-outline-secondary ms-2">Cancel</a></div>
            </div>
        </form>
    </div></div>
</content></body></html>
