<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body>
<content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🛒 Shopping Cart</h2>
        <div>
            <a th:href="@{/cart-saveds/save}" th:if="${!#lists.isEmpty(cartItems)}">
                <form th:action="@{/cart-saveds/save}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-info">💾 Save Cart</button>
                </form>
            </a>
            <form th:action="@{/cart-temps/cancel}" method="post" class="d-inline"
                  th:if="${!#lists.isEmpty(cartItems)}"
                  onsubmit="return confirm('Cancel cart and restore all items?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger ms-2">✗ Cancel Cart</button>
            </form>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
        Your cart is empty. <a th:href="@{/items}">Browse items</a>
    </div>

    <div th:if="${!#lists.isEmpty(cartItems)}">
        <div class="card mb-3">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Item</th>
                            <th>Unit Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ct : ${cartItems}">
                            <td th:text="${ct.item.description}"></td>
                            <td th:text="${#numbers.formatDecimal(ct.item.price, 1, 2)} + ' AOA'"></td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <form th:action="@{/cart-temps/{id}/decrement(id=${ct.id})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-secondary">-</button>
                                    </form>
                                    <span class="fw-bold" th:text="${ct.quantity}"></span>
                                    <form th:action="@{/cart-temps/{id}/increment(id=${ct.id})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-secondary">+</button>
                                    </form>
                                </div>
                            </td>
                            <td class="fw-bold" th:text="${#numbers.formatDecimal(ct.item.price.multiply(new java.math.BigDecimal(ct.quantity)), 1, 2)} + ' AOA'"></td>
                            <td>
                                <form th:action="@{/cart-temps/{id}/remove(id=${ct.id})}" method="post"
                                      onsubmit="return confirm('Remove this item?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot class="table-light">
                        <tr>
                            <td colspan="3" class="text-end fw-bold">Total:</td>
                            <td class="fw-bold text-success fs-5" th:text="${#numbers.formatDecimal(total, 1, 2)} + ' AOA'"></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <div class="text-end">
            <a th:href="@{/invoice-temps/new}" class="btn btn-success btn-lg">
                🧾 Create Invoice
            </a>
        </div>
    </div>
</content>
</body>
</html>
