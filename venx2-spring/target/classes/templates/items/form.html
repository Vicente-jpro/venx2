<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">
<body>
<content th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${item.id != null ? '✏️ Edit Item' : '➕ New Item'}">Item Form</h2>
        <a th:href="@{/items}" class="btn btn-outline-secondary">← Back</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="${item.id != null ? '/items/' + item.id + '/update' : '/items'}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Description *</label>
                        <input type="text" name="description" class="form-control" th:value="${item.description}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Item Code *</label>
                        <input type="text" name="itemCode" class="form-control" th:value="${item.itemCode}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Quantity *</label>
                        <input type="number" name="quantity" class="form-control" th:value="${item.quantity}" min="0" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Base Price (AOA) *</label>
                        <input type="number" name="price" class="form-control" th:value="${item.price}" step="0.01" min="0" required>
                        <small class="text-muted">Final price = price + 14% IVA + profit</small>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Profit Value (AOA) *</label>
                        <input type="number" name="profiteValue" class="form-control" th:value="${item.profiteValue}" step="0.01" min="0" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Manufacturing Date</label>
                        <input type="date" name="manufacturingDate" class="form-control"
                               th:value="${item.manufacturingDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Expiration Date</label>
                        <input type="date" name="expirationDate" class="form-control"
                               th:value="${item.expirationDate}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Category</label>
                        <select name="categoryId" class="form-select">
                            <option value="">-- Select Category --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.nameCategory}"
                                    th:selected="${item.category != null and item.category.id == c.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Sector</label>
                        <select name="sectorId" class="form-select">
                            <option value="">-- Select Sector --</option>
                            <option th:each="s : ${sectors}" th:value="${s.id}" th:text="${s.nameSector}"
                                    th:selected="${item.sector != null and item.sector.id == s.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Supplier</label>
                        <select name="supplierId" class="form-select">
                            <option value="">-- Select Supplier --</option>
                            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.nameSupplier}"
                                    th:selected="${item.supplier != null and item.supplier.id == s.id}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success px-5">
                            <span th:text="${item.id != null ? 'Update Item' : 'Create Item'}">Save</span>
                        </button>
                        <a th:href="@{/items}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</content>
</body>
</html>
